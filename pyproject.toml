[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manifold-asof"
version = "0.1.0"
description = "Find outcome-dependent fields in Manifold market data and rebuild a market as of a past time, for leak-free backtests."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3"]

[project.scripts]
manifold-asof = "manifold_asof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
